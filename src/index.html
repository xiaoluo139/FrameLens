<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: flfile: https:; img-src 'self' data: flfile: https: http:; media-src 'self' data: flfile: https: http:; connect-src 'self' data: flfile:;" />
    <title>影析 FrameLens</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <!-- ---------------------------------------------------------------- 图标库 -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 0 1.4 0l4.3-4.3a3 3 0 1 0-4.2-4.2l-1.3 1.3 1.4 1.4 1.3-1.3a1 1 0 1 1 1.4 1.4l-4.3 4.3a1 1 0 0 0 0 1.4zm2.8-2.8a1 1 0 0 0-1.4 0l-4.3 4.3a3 3 0 1 0 4.2 4.2l1.3-1.3-1.4-1.4-1.3 1.3a1 1 0 1 1-1.4-1.4l4.3-4.3a1 1 0 0 0 0-1.4z"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-4 4V6a2 2 0 0 1 2-2z"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M12 5c-5 0-8.5 4.2-9.7 6.1a1.7 1.7 0 0 0 0 1.8C3.5 14.8 7 19 12 19s8.5-4.2 9.7-6.1a1.7 1.7 0 0 0 0-1.8C20.5 9.2 17 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM16.5 9.2 21 6.6v10.8l-4.5-2.6z"/></symbol>
      <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M4 6h2v2H4zm4 0h12v2H8zM4 11h2v2H4zm4 0h12v2H8zM4 16h2v2H4zm4 0h12v2H8z"/></symbol>
      <symbol id="i-chip" viewBox="0 0 24 24"><path d="M9 2h2v2h2V2h2v2h1a2 2 0 0 1 2 2v1h2v2h-2v2h2v2h-2v2h2v2h-2v1a2 2 0 0 1-2 2h-1v2h-2v-2h-2v2H9v-2H8a2 2 0 0 1-2-2v-1H4v-2h2v-2H4v-2h2V9H4V7h2V6a2 2 0 0 1 2-2h1zm0 6v8h6V8z"/></symbol>
      <symbol id="i-cog" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4-.1 1.4 2 1.5-2 3.4-2.3-1a7.5 7.5 0 0 1-2.4 1.4L15.6 22h-4l-.5-2.3a7.5 7.5 0 0 1-2.4-1.4l-2.3 1-2-3.4 2-1.5L6.3 12l.1-1.4-2-1.5 2-3.4 2.3 1a7.5 7.5 0 0 1 2.4-1.4L11.6 2h4l.6 2.3a7.5 7.5 0 0 1 2.4 1.4l2.3-1 2 3.4-2 1.5z"/></symbol>
      <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 3h6v2h2a2 2 0 0 1 2 2v1h-2V7H7v11h10v-1h2v1a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2zM12 9l5 4h-3v6h-4v-6H7z"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2l2.2 5.6L20 9.8l-4.6 3.3L16.6 19 12 15.8 7.4 19l1.2-5.9L4 9.8l5.8-2.2z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M11 3h2v9l3.5-3.5 1.4 1.4L12 16.8 6.1 9.9l1.4-1.4L11 12V3zM5 19h14v2H5z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 3h9a1 1 0 0 1 1 1v12h-2V5H9zM6 7h9a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h3.5l2 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5 18.5 12 8 18.5z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M9.6 16.2 5.4 12l-1.4 1.4 5.6 5.6L20.4 8.2 19 6.8z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m12 10.6 5-5L18.4 7l-5 5 5 5L17 18.4l-5-5-5 5L5.6 17l5-5-5-5L7 5.6z"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 12h14l-4.5-6-3.2 4.2-2.1-2.6zM8.5 11a1.8 1.8 0 1 0 0-3.6A1.8 1.8 0 0 0 8.5 11z"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.4a15 15 0 0 0-1.2-3.3A8 8 0 0 1 18.9 8zM12 4.2c.7 1 1.3 2.3 1.7 3.8h-3.4c.4-1.5 1-2.8 1.7-3.8zM4.3 14a8 8 0 0 1 0-4h2.9a19 19 0 0 0 0 4zm.8 2h2.4c.3 1.2.7 2.3 1.2 3.3A8 8 0 0 1 5.1 16zm2.4-8H5.1a8 8 0 0 1 3.6-3.3A15 15 0 0 0 7.5 8zM12 19.8c-.7-1-1.3-2.3-1.7-3.8h3.4c-.4 1.5-1 2.8-1.7 3.8zM14.2 14H9.8a17 17 0 0 1 0-4h4.4a17 17 0 0 1 0 4zm.3 5.3c.5-1 .9-2.1 1.2-3.3h2.4a8 8 0 0 1-3.6 3.3zM16.8 14a19 19 0 0 0 0-4h2.9a8 8 0 0 1 0 4z"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 22 20H2zm-1 6h2v5h-2zm0 6h2v2h-2z"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></symbol>
      <symbol id="i-mask" viewBox="0 0 24 24"><path d="M12 3c4.4 0 8 3.1 8 7 0 4.8-3.6 11-8 11S4 14.8 4 10c0-3.9 3.6-7 8-7z"/></symbol>
    </svg>

    <!-- ---------------------------------------------------------------- 标题栏 -->
    <header class="titlebar">
      <div class="titlebar__brand">
        <span class="brandmark"><svg viewBox="0 0 24 24"><use href="#i-play" /></svg></span>
        <span class="titlebar__name">影析 <em>FrameLens</em></span>
      </div>
      <div class="titlebar__status" id="titlebar-status">
        <span class="dot" data-state="idle" id="engine-dot"></span>
        <span id="engine-label">正在初始化…</span>
      </div>
      <div class="titlebar__spacer"></div>
    </header>

    <div class="app">
      <!-- -------------------------------------------------------------- 侧边栏 -->
      <nav class="rail" id="rail">
        <div class="rail__group">
          <button class="rail__item" data-nav="home"><svg><use href="#i-home" /></svg><span>工作台</span></button>
          <button class="rail__item" data-nav="parse"><svg><use href="#i-link" /></svg><span>全平台解析</span></button>
          <button class="rail__item" data-nav="chat"><svg><use href="#i-chat" /></svg><span>模型对话</span></button>
          <button class="rail__item" data-nav="vision"><svg><use href="#i-eye" /></svg><span>图像理解</span></button>
          <button class="rail__item" data-nav="video"><svg><use href="#i-video" /></svg><span>视频理解</span></button>
        </div>
        <div class="rail__group rail__group--bottom">
          <button class="rail__item" data-nav="tasks"><svg><use href="#i-tasks" /></svg><span>任务中心</span><b class="rail__badge" id="task-badge"></b></button>
          <button class="rail__item" data-nav="models"><svg><use href="#i-chip" /></svg><span>模型中心</span></button>
          <button class="rail__item" data-nav="settings"><svg><use href="#i-cog" /></svg><span>设置</span></button>
        </div>
      </nav>

      <!-- -------------------------------------------------------------- 主区域 -->
      <main class="main" id="main">
        <section class="page" data-page="home"></section>
        <section class="page" data-page="parse"></section>
        <section class="page" data-page="chat"></section>
        <section class="page" data-page="vision"></section>
        <section class="page" data-page="video"></section>
        <section class="page" data-page="tasks"></section>
        <section class="page" data-page="models"></section>
        <section class="page" data-page="settings"></section>
      </main>
    </div>

    <div class="toasts" id="toasts"></div>
    <div class="modal-root" id="modal-root" hidden></div>

    <script src="js/core.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/parse.js"></script>
    <script src="js/pages/chat.js"></script>
    <script src="js/pages/vision.js"></script>
    <script src="js/pages/video.js"></script>
    <script src="js/pages/tasks.js"></script>
    <script src="js/pages/models.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
